<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="../index.css" />
  </head>
  <body>
    <main id="app">
      <header class="ya-app-header">
        <span class="ya-app-title" id="app-name"></span>
        <a class="ya-app-brand" href="https://apps.yaiol.com/" target="_blank" rel="noopener noreferrer" title="yaiol Apps">
          <img src="../assets/yaiol-logo.svg" alt="yaiol" />
        </a>
      </header>
      <div id="bar-list"></div>
      <label id="show-commons-toggle" class="show-commons">
        <input type="checkbox" id="show-commons-cb" />
        <span data-i18n="popupShowCommons">Show common bars</span>
      </label>
      <footer class="ya-app-footer">
        <span class="ya-footer-version" id="app-version"></span>
        <div class="ya-footer-icons">
          <a class="ya-footer-btn" href="https://github.com/yaiol/bookmarks" target="_blank" rel="noopener noreferrer" data-i18n-title="tooltipGithub" title="Source on GitHub">
            <svg data-icon="yaiol:github" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          </a>
          <a class="ya-footer-btn" id="help-link" href="https://apps.yaiol.com/en/p/bookmarks/help/" target="_blank" rel="noopener noreferrer" data-i18n-title="tooltipHelp" title="Help">
            <svg data-icon="lucide:circle-question-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          </a>
          <button id="settings-btn" class="ya-footer-btn" data-i18n-title="tooltipSettings" title="Settings">
            <svg data-icon="lucide:settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </footer>
    </main>

    <!-- Dirty-switch confirmation modal -->
    <div id="dirty-modal" class="ya-modal-overlay hidden">
      <div class="ya-modal-box">
        <p id="dirty-message">Save changes before switching?</p>
        <div class="ya-modal-actions">
          <button id="dirty-cancel" class="ya-btn ya-btn-secondary" data-i18n="btnCancel">Cancel</button>
          <button id="dirty-discard" class="ya-btn ya-btn-danger" data-i18n="btnDiscard">Discard</button>
          <button id="dirty-save" class="ya-btn ya-btn-primary" data-i18n="btnSave">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
